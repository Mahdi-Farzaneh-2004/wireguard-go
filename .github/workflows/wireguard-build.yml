name: Build WireGuard client.conf

on:
  workflow_dispatch:

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qrencode

      - name: Generate client.conf (all from secrets)
        env:
          CLIENT_NAME: ${{ secrets.CLIENT_NAME }}
          CLIENT_PRIVATE_KEY: ${{ secrets.CLIENT_PRIVATE_KEY }}
          SERVER_PUBLIC_KEY: ${{ secrets.SERVER_PUBLIC_KEY }}
          CLIENT_ADDRESS: ${{ secrets.CLIENT_ADDRESS }}
          CLIENT_DNS: ${{ secrets.CLIENT_DNS }}
          SERVER_ENDPOINT: ${{ secrets.SERVER_ENDPOINT }}
          CLIENT_ALLOWED_IPS: ${{ secrets.CLIENT_ALLOWED_IPS }}
        run: |
          set -euo pipefail

          # validate
          for v in CLIENT_NAME CLIENT_PRIVATE_KEY SERVER_PUBLIC_KEY CLIENT_ADDRESS CLIENT_DNS SERVER_ENDPOINT CLIENT_ALLOWED_IPS; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing secret: $v"
              exit 1
            fi
          done
